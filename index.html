<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<script>
try{var t=localStorage.getItem('brass-vault.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --iron:#15191E; --steel:#1F252C; --plate:#29303A; --line:#39414C;
  --brass:#C9A45C; --brass-hi:#E8CC8E; --brass-lo:#8A6D35;
  --paper:#ECE6D8; --muted:#98A1AC; --danger:#D46A52; --ok:#86B99E;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --field:#15191E; --well:rgba(0,0,0,.18); --hair:rgba(255,255,255,.05);
  --glow:#25303A; --grain:rgba(255,255,255,.014); --accent-text:#E8CC8E;
  --toast-bg:#ECE6D8; --toast-fg:#1A1D21; --sheet-shadow:0 30px 80px rgba(0,0,0,.6);
  --ninja-edge:rgba(232,204,142,.55);
  --sky1:#0A1019; --sky2:#172130; --sky3:#28313F; --orb:#EFE7CF; --orb-glow:rgba(239,231,207,.28); --stars:1;
  --m1:#2A3442; --m2:#212A36; --m3:#19212A; --m4:#10151B; --mist-c:#8FA3B8; --mist-o:.16;
  --river:#3B4C5F; --petal:#E39AAA; --lantern:#F2B25C; --lamp:1;
  --wood:#5A4530; --straw:#8C7A52; --panel:rgba(21,25,30,.8); --rain-c:rgba(190,210,230,.7); --rain-dim:rgba(6,9,14,.4);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --iron:#E6E9EC; --steel:#F4F5F7; --plate:#FFFFFF; --line:#CBD1D8;
  --brass:#B08A40; --brass-hi:#D2AE66; --brass-lo:#7A5C24;
  --paper:#1D2229; --muted:#5B6570; --danger:#B8472F; --ok:#3B8660;
  --field:#FFFFFF; --well:#F2F4F6; --hair:rgba(0,0,0,.07);
  --glow:#FFFFFF; --grain:rgba(0,0,0,.018); --accent-text:#8A6624;
  --toast-bg:#1D2229; --toast-fg:#F4F5F7; --sheet-shadow:0 24px 60px rgba(30,40,55,.25);
  --ninja-edge:rgba(255,255,255,.9);
  --sky1:#93BDD6; --sky2:#CBDFE9; --sky3:#EEF0EA; --orb:#F7DA92; --orb-glow:rgba(247,218,146,.5); --stars:0;
  --m1:#AFC1CD; --m2:#91A7B6; --m3:#6E8696; --m4:#4B6171; --mist-c:#FFFFFF; --mist-o:.7;
  --river:#D3E4EC; --petal:#F2A3B6; --lantern:#F2B25C; --lamp:.35;
  --wood:#7E6040; --straw:#CDB67A; --panel:rgba(246,247,249,.84); --rain-c:rgba(70,90,115,.55); --rain-dim:rgba(55,65,80,.28);
  color-scheme:light;
}
:root[data-theme="light"] .avatar{background:hsl(var(--h) 45% 91%);color:hsl(var(--h) 45% 30%);border-color:hsl(var(--h) 30% 78%)}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(30,40,55,.06), inset 0 1px 0 #fff}
:root[data-theme="light"] .dial{filter:drop-shadow(0 16px 22px rgba(30,40,55,.3))}
:root[data-theme="light"] .shred-overlay{background:rgba(30,36,44,.45)}
html.theme-anim, html.theme-anim *{transition:background-color .3s, color .3s, border-color .3s !important}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--iron);
  background-image:
    repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 3px),
    radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--iron) 62%);
  background-attachment:fixed;
  color:var(--paper);
  font:400 15px/1.55 var(--body);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:transform .08s, filter .15s, background-color .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:progress}
.btn svg{width:17px;height:17px}
.btn-brass{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,var(--brass-lo));color:#221A0B;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #54411E}
.btn-brass:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--paper)}
.btn-ghost:hover{background:var(--plate)}
.btn-danger{background:var(--danger);color:#1D0C07;box-shadow:0 2px 0 #7A3526}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:transparent;padding-left:4px;padding-right:4px}
.btn-danger-ghost:hover{text-decoration:underline}
.linklike{background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0}
.linklike:hover{color:var(--paper)}

.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--muted);transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--plate);color:var(--paper);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px}

.field{display:block;text-align:left;margin-bottom:14px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,164,92,.18)}
textarea.input{resize:vertical;min-height:72px}
.err{color:var(--danger);font-size:14px;min-height:1.4em;margin:4px 0 10px;text-align:left}

/* ---------- Lock screen ---------- */
.lock-theme{position:fixed;top:16px;right:16px;z-index:5}
.lock{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:150px 20px 32px}
.lock.leaving{opacity:0;transform:scale(1.04)}
.lock-inner{width:100%;max-width:380px;text-align:center}
.lock-card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.torii{position:absolute;left:-60px;top:-70px;width:340px;height:290px;z-index:0;overflow:visible}
.dial-wrap{position:relative;width:220px;margin:0 auto 26px}
.dial{position:relative;z-index:1;width:220px;height:220px;margin:0;display:block;filter:drop-shadow(0 20px 28px rgba(0,0,0,.5))}
#dialFace{transform-origin:110px 110px;transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.lock h1{font:700 48px/1 var(--display);letter-spacing:-.025em;margin:0 0 10px}
.lock .sub{margin:0 auto 26px;color:var(--muted);max-width:30ch}
.lock .btn{width:100%;padding:13px 16px}
.lock .fine{margin:22px 0 0;font-size:13px;color:var(--muted)}
.lock .fine + .fine{margin-top:8px}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- App ---------- */
.app{max-width:1120px;margin:0 auto;padding:32px 20px 96px;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 28px;flex-wrap:wrap;margin-bottom:28px}
.brand h1{
  font:700 clamp(44px,7vw,68px)/.9 var(--display);letter-spacing:-.035em;margin:0;
  background:linear-gradient(180deg,var(--brass-hi) 10%,var(--brass) 55%,var(--brass-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.count{margin:8px 0 0;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:280px}
.search{position:relative;flex:1;max-width:340px;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{padding-left:38px;padding-right:38px;background:var(--field)}
.search kbd{position:absolute;right:10px;top:50%;translate:0 -50%;font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.iconbar{display:flex;gap:2px;padding-left:6px;border-left:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{
  position:relative;
  background:linear-gradient(180deg,var(--plate),var(--steel));
  border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:12px;min-width:0;
}
.card-head{display:flex;align-items:center;gap:12px}
.avatar{
  flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  font:700 19px var(--display);
  background:hsl(var(--h) 26% 24%);color:hsl(var(--h) 60% 80%);
  border:1px solid hsl(var(--h) 28% 36%);
}
.card-title{flex:1;min-width:0}
.card-title h3{margin:0;font:600 17px/1.25 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{display:flex;flex-direction:column;background:var(--well);border:1px solid var(--hair);border-radius:10px}
.row{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 12px}
.row + .row{border-top:1px solid var(--hair)}
.row-l{flex:1;min-width:0}
.row-label{display:block;font-size:12px;color:var(--muted)}
.row-v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-v.mono{font-size:14px;letter-spacing:.02em}
.row-a{display:flex;gap:2px}
.row-a .icon-btn{width:32px;height:32px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.card-foot a{color:var(--accent-text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.card-foot a:hover{text-decoration:underline;text-underline-offset:3px}
.card-foot a svg{width:14px;height:14px}
.note-dot{display:inline-flex;align-items:center;gap:5px}

.empty{max-width:440px;margin:72px auto 0;text-align:center;background:var(--steel);border:1px solid var(--line);border-radius:18px;padding:30px 28px}
.empty h2{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 22px}
.empty-small{width:fit-content;margin:56px auto 0;text-align:center;color:var(--muted);background:var(--steel);border:1px solid var(--line);border-radius:999px;padding:8px 18px}

/* ---------- Dialogs ---------- */
dialog.sheet{
  width:min(480px, calc(100% - 28px));max-height:calc(100vh - 40px);
  background:var(--steel);color:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:24px;box-shadow:var(--sheet-shadow), inset 0 1px 0 rgba(255,255,255,.06);
}
dialog.sheet.small{width:min(400px, calc(100% - 28px))}
dialog.sheet[open]{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
dialog::backdrop{background:rgba(8,10,12,.62);backdrop-filter:blur(4px)}
.sheet h2{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 18px}
.sheet .muted{margin:-8px 0 16px}
.sheet-actions{display:flex;align-items:center;gap:10px;margin-top:6px}
.spacer{flex:1}
.pw-wrap{display:flex;gap:6px}
.pw-wrap .input{flex:1}
.pw-wrap .icon-btn{width:44px;height:auto;border-color:var(--line)}
.meter{height:5px;border-radius:5px;background:var(--hair);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:5px;background:var(--danger);transition:width .25s,background-color .25s}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
.gen-row .len{display:flex;align-items:center;gap:10px;flex:1}
.gen-row input[type=range]{flex:1;accent-color:var(--brass)}
.gen-row output{font-family:var(--mono);color:var(--paper);min-width:2ch}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.check input{accent-color:var(--brass);width:16px;height:16px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;pointer-events:none;
  background:var(--toast-bg);color:var(--toast-fg);font-weight:500;padding:11px 18px;border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);transition:opacity .2s, translate .2s;max-width:calc(100% - 32px);text-align:center;z-index:10;
}
.toast.show{opacity:1;translate:-50% 0}
.toast.bad{background:var(--danger);color:#1D0C07}

/* ---------- Delete animation: terminal + bin ---------- */
.shred-overlay{position:fixed;inset:0;z-index:20;background:rgba(8,10,12,.45);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0;animation:fadeIn .2s ease-out;cursor:pointer}
.shred-overlay.out{animation:fadeOut .3s ease-in forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.term{
  width:min(580px,100%);background:#0B0F0C;border:1px solid #243428;border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(120,230,150,.04),0 0 40px rgba(90,220,130,.08);
  animation:pop .25s ease-out;
}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#141A16;border-bottom:1px solid #1F2B22}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#D46A52}
.term-bar i:nth-child(2){background:#C9A45C}.term-bar i:nth-child(3){background:#6FB582}
.term-bar span{margin-left:8px;font:500 12px var(--mono);color:#6D8574}
.term-body{
  margin:0;padding:16px 18px 18px;min-height:190px;font:400 13.5px/1.75 var(--mono);color:#8FE3A2;white-space:pre-wrap;word-break:break-all;
  background-image:repeating-linear-gradient(0deg,rgba(143,227,162,.035) 0 1px,transparent 1px 3px);
  text-shadow:0 0 6px rgba(120,230,150,.35);
}
.t-cmd{color:#ECE6D8;text-shadow:none}
.t-cmd::before{content:"$ ";color:#6FB582}
.t-warn{color:var(--brass-hi)}
.t-red{color:#FF8A70}
.t-dim{color:#58705F}
.t-purple{color:#B9A0FF;text-shadow:0 0 6px rgba(160,120,255,.4)}
.shred-overlay.low{align-items:flex-end;padding:0 16px 110px}
.shred-overlay.low .shred-hint{bottom:auto;top:18px}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:#8FE3A2;margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shred-hint{position:fixed;left:50%;bottom:22px;translate:-50% 0;font-size:13px;color:var(--muted)}
.card-ghost{position:fixed;z-index:25;margin:0;pointer-events:none;transform-origin:50% 50%}
.glitch{animation:glitch .45s steps(2) infinite}
@keyframes glitch{
  0%{clip-path:inset(0 0 0 0);transform:translate(0)}
  20%{clip-path:inset(12% 0 60% 0);transform:translate(-6px,1px);filter:hue-rotate(90deg)}
  40%{clip-path:inset(55% 0 10% 0);transform:translate(5px,-2px)}
  60%{clip-path:inset(30% 0 35% 0);transform:translate(-3px,0);filter:saturate(3)}
  80%{clip-path:inset(0 0 0 0);transform:translate(2px,1px)}
}
.bin{position:fixed;right:28px;bottom:28px;width:78px;height:90px;z-index:30;pointer-events:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));animation:binIn .35s cubic-bezier(.3,1.5,.5,1)}
.bin.out{animation:binOut .3s ease-in forwards}
@keyframes binIn{from{transform:translateY(130px) rotate(8deg)}}
@keyframes binOut{to{transform:translateY(130px);opacity:0}}
.bin .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.bin.open .lid{transform:rotate(-42deg) translateY(-4px)}
.bin.shake{animation:binShake .4s}
@keyframes binShake{25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}

/* ---------- Ninja ---------- */
.ninja{position:absolute;left:0;top:0;width:72px;height:90px;pointer-events:none;transform-origin:50% 60%;will-change:transform}
.ninja svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1px var(--ninja-edge)) drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.ninja .nb{fill:#1F242B}
.ninja .limb{stroke:#1F242B;stroke-width:6.5;stroke-linecap:round;fill:none}
.ninja .belt{fill:#C9A45C}
.ninja .band{fill:#D46A52}
.ninja .tails{stroke:#D46A52;stroke-width:3.2;stroke-linecap:round;fill:none}
.ninja .slit{fill:#E8C9A4}
.ninja .eyes{fill:#15191E}
.ninja .blade{stroke:#AEB6BF;stroke-width:2.4;stroke-linecap:round}
.ninja .hilt{stroke:#C9A45C;stroke-width:3.6;stroke-linecap:round}
.ninja .rig,.ninja .leg-l,.ninja .leg-r,.ninja .arm-l,.ninja .arm-r,.ninja .head-g,.ninja .tails,.ninja .eyes{transform-box:view-box}
.ninja .rig{transform-origin:32px 76px;transition:transform .15s}
.ninja .leg-l{transform-origin:28px 54px}.ninja .leg-r{transform-origin:36px 54px}
.ninja .arm-l{transform-origin:27px 40px}.ninja .arm-r{transform-origin:37px 40px}
.ninja .head-g{transform-origin:32px 34px}
.ninja .tails{transform-origin:22px 17px;animation:nTails .6s ease-in-out infinite alternate}
.ninja .eyes{transform-origin:36px 22.5px;animation:nBlink 3.8s infinite}
@keyframes nTails{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
@keyframes nBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ninja.run .rig{transform:rotate(10deg)}
.ninja.run .tails{animation-duration:.18s}
.ninja.run .leg-l{animation:nLegs .26s ease-in-out infinite alternate}
.ninja.run .leg-r{animation:nLegs .26s ease-in-out infinite alternate-reverse}
.ninja.run .arm-l{animation:nArms .26s ease-in-out infinite alternate-reverse}
.ninja.run .arm-r{animation:nArms .26s ease-in-out infinite alternate}
@keyframes nLegs{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
@keyframes nArms{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
.ninja.jump .leg-l{transform:rotate(-60deg)}.ninja.jump .leg-r{transform:rotate(-25deg)}
.ninja.jump .arm-l{transform:rotate(70deg)}.ninja.jump .arm-r{transform:rotate(-110deg)}
.ninja.slash .arm-r{animation:nSlash .3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes nSlash{0%{transform:rotate(-170deg)}100%{transform:rotate(25deg)}}
.ninja.perch .rig{animation:nBreathe 2.6s ease-in-out infinite}
.ninja.perch .leg-l{transform:rotate(-14deg)}.ninja.perch .leg-r{transform:rotate(14deg)}
@keyframes nBreathe{50%{transform:scaleY(.96)}}
.ninja.nope .head-g{animation:nNope .55s}
@keyframes nNope{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.ninja .hand-blade{display:none}
.ninja.armed .hand-blade{display:inline}
.ninja.armed .back{display:none}
.ninja.face-left svg{transform:scaleX(-1)}
.ninja.thief .nb{fill:#2B2135}
.ninja.thief .limb{stroke:#2B2135}
.ninja.thief .band{fill:#8A6BE0}
.ninja.thief .tails{stroke:#8A6BE0}
.ninja.thief .belt{fill:#5B4A7A}
.ninja.thief .eyes{fill:#FF4D4D}

const LAPTOP_SVG = `<svg viewBox="0 0 34 24" aria-hidden="true"><rect x="4" y="1" width="26" height="17" rx="2" fill="#1C2A20" stroke="#3A4A3E"/><rect x="6" y="3" width="22" height="13" fill="#0B150F"/><path d="M8 6h10M8 9h14M8 12h8" stroke="#8FE3A2" stroke-width="1.4"/><rect x="0" y="18" width="34" height="4" rx="2" fill="#3A424E"/></svg>`;

let shredBusy = false;
async function shredAnimation(entry) {
  const cardEl = cardEls.get(entry);
  if (reduceMotion || !cardEl || !cardEl.isConnected) return;
  shredBusy = true;

  let skip = false;
  const sleep = ms => skip ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
  const dur = ms => skip ? 1 : ms;
  const go = (node, frames, ms, easing = 'ease-in-out') =>
    node.animate(frames, { duration: dur(ms), easing, fill: 'forwards' }).finished.catch(() => {});
  const fade = (node, from, to, ms = 150) => node.animate([{ opacity: from }, { opacity: to }], { duration: dur(ms), fill: 'forwards' });
  const restart = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  let r = cardEl.getBoundingClientRect();
  if (r.top < 70 || r.bottom > innerHeight - 20) { cardEl.scrollIntoView({ block: 'center' }); r = cardEl.getBoundingClientRect(); }

  // overlay + terminal (placed away from the card)
  const ov = el('div', 'shred-overlay');
  if (r.top + r.height / 2 < innerHeight / 2) ov.classList.add('low');
  const term = el('div', 'term'), bar = el('div', 'term-bar'), body = el('pre', 'term-body');
  bar.append(el('i'), el('i'), el('i'), el('span', null, 'intruder@vault \u2014 zsh'));
  term.append(bar, body);
  ov.append(term, el('div', 'shred-hint', 'Click anywhere to skip'));
  ov.addEventListener('click', () => { skip = true; });
  document.body.append(ov);

  // lift the card above the dim layer
  const ghost = cardEl.cloneNode(true);
  ghost.classList.add('card-ghost');
  Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.append(ghost);
  cardEl.style.visibility = 'hidden';

  const layer = el('div', 'ninja-layer'); document.body.append(layer);
  const vn = document.getElementById('valleyNinja'); vn?.classList.add('away');
  let bin = null;

  const type = async (text, cls, speed = 20) => {
    const line = el('div', cls), cur = el('span', 'cur');
    line.append(cur); body.append(line);
    for (let i = 0; i < text.length; i++) {
      if (skip) { cur.before(text.slice(i)); break; }
      cur.before(text[i]); await sleep(speed + Math.random() * 25);
    }
    cur.remove(); return line;
  };

  try {
    const W = 72, H = 90;
    const base = Math.min(r.bottom, innerHeight - 8) - H;
    const thiefX = Math.min(Math.max(r.right - W * .35, W + 60), innerWidth - W - 8);
    const slug = (entry.name || 'login').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'login';
    const hex = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');

    // 1. the thief drops in on a rope
    const thief = makeNinja(); thief.classList.add('thief', 'face-left');
    const rope = el('div', 'rope'); const ropeLen = base + 18;
    Object.assign(rope.style, { left: thiefX + W / 2 - 1 + 'px', height: ropeLen + 'px' });
    layer.append(rope, thief);
    const dropEase = 'cubic-bezier(.3,.8,.4,1)';
    await Promise.all([
      go(thief, [{ transform: T(thiefX, -H - 20) }, { transform: T(thiefX, base) }], 700, dropEase),
      go(rope, [{ transform: `translateY(${-H - 20 - base}px)` }, { transform: 'translateY(0)' }], 700, dropEase)
    ]);
    go(rope, [{ transform: 'translateY(0)' }, { transform: `translateY(${-ropeLen - 10}px)` }], 300, 'ease-in').then(() => rope.remove());

    // 2. he starts hacking
    const lap = el('div', 'laptop'); lap.innerHTML = LAPTOP_SVG;
    Object.assign(lap.style, { left: thiefX - 30 + 'px', top: base + H - 28 + 'px' });
    layer.append(lap); fade(lap, 0, 1, 200);
    thief.classList.add('typing');
    await type(`./steal.sh --target "${slug}" --stealth`, 't-cmd', 30);
    await type('[intruder] bypassing vault seal ....... ok', 't-purple', 9);
    await type(`[intruder] decrypting record 0x${hex}`, 't-purple', 9);

    // 3. the guardian charges in
    const guard = makeNinja(); guard.classList.add('run'); layer.append(guard);
    const meetX = thiefX - W * .8;
    const startX = -W - 10;
    const runTo = Math.max(startX + 40, meetX - 90);
    const alert = type('[ALERT] guardian ninja detected!', 't-red', 10);
    await go(guard, [{ transform: T(startX, base) }, { transform: T(runTo, base) }], Math.min(Math.max((runTo - startX) * 1.1, 300), 900), 'linear');
    thief.classList.remove('typing'); thief.classList.add('armed', 'ready'); fade(lap, 1, 0);
    guard.classList.replace('run', 'jump');
    await go(guard, [{ transform: T(runTo, base) }, { transform: T((runTo + meetX) / 2, base - 60) }, { transform: T(meetX, base) }], 380, 'ease-out');
    guard.classList.remove('jump'); guard.classList.add('armed', 'ready');
    await alert;

    // 4. the duel
    const cx = (meetX + W * .85 + thiefX + W * .15) / 2, cy = base + H * .4;
    const calls = ['[combat] clang! parried', '[combat] clang! parried again', '[combat] clang! blades locked'];
    for (let i = 0; i < 3; i++) {
      await Promise.all([
        go(guard, [{ transform: T(meetX, base) }, { transform: T(meetX + 12, base) }], 110, 'ease-in'),
        go(thief, [{ transform: T(thiefX, base) }, { transform: T(thiefX - 12, base) }], 110, 'ease-in')
      ]);
      restart(guard, 'slash'); restart(thief, 'slash');
      spark(cx, cy - i * 8, layer);
      type(calls[i], 't-warn', 3);
      await Promise.all([
        go(guard, [{ transform: T(meetX + 12, base) }, { transform: T(meetX, base) }], 170, 'ease-out'),
        go(thief, [{ transform: T(thiefX - 12, base) }, { transform: T(thiefX, base) }], 170, 'ease-out')
      ]);
      guard.classList.remove('slash'); thief.classList.remove('slash');
      await sleep(180);
    }

    // 5. a sneaky kick — the guardian loses
    thief.classList.add('kick');
    await go(thief, [{ transform: T(thiefX, base) }, { transform: T(thiefX - 24, base) }], 130, 'ease-in');
    spark(meetX + W * .75, base + H * .55, layer);
    const kx = Math.max(8, meetX - 170);
    await go(guard, [
      { transform: T(meetX, base, 0) },
      { transform: T((meetX + kx) / 2, base - 90, -300) },
      { transform: T(kx, base + 22, -450) }
    ], 650, 'cubic-bezier(.2,.6,.4,1)');
    guard.classList.remove('ready', 'armed'); guard.classList.add('down');
    const dizzy = el('div', 'dizzy'); dizzy.append(el('span', null, '\u2726'), el('span', null, '\u2727'), el('span', null, '\u2726'));
    Object.assign(dizzy.style, { left: kx + 7 - 20 + 'px', top: base + 38 + 'px' });
    layer.append(dizzy);
    thief.classList.remove('kick');
    go(thief, [{ transform: T(thiefX - 24, base) }, { transform: T(thiefX, base - 14) }, { transform: T(thiefX, base) }], 260);
    await type('[combat] guardian down. intruder wins.', 't-red', 12);

    // 6. back to the laptop to shred the record
    thief.classList.remove('armed', 'ready'); thief.classList.add('typing'); fade(lap, 0, 1);
    const pLine = el('div', 't-warn'); body.append(pLine);
    pLine.append('[shred] overwriting password  ');
    const barSpan = el('span'); pLine.append(barSpan);
    for (let i = 0; i <= 20; i++) {
      barSpan.textContent = '\u2588'.repeat(i) + '\u2591'.repeat(20 - i) + ` ${String(i * 5).padStart(3)}%`;
      await sleep(38);
    }
    await type('[shred] wiping username, url, notes ... done', null, 7);
    thief.classList.remove('typing'); fade(lap, 1, 0);
    ghost.classList.add('glitch'); await sleep(450); ghost.classList.remove('glitch');

    // 7. grab the card and toss it in the bin
    bin = el('div', 'bin'); bin.innerHTML = BIN_SVG; document.body.append(bin);
    await sleep(250);
    const gcx = r.left + r.width / 2, gcy = r.top + r.height / 2;
    const dx1 = thiefX + W * .2 - gcx, dy1 = base + H * .45 - gcy;
    await go(ghost, [{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx1}px,${dy1}px) scale(.12) rotate(-20deg)` }], 380, 'cubic-bezier(.5,0,.7,1)');
    bin.classList.add('open'); restart(thief, 'slash');
    const b = bin.getBoundingClientRect();
    const dx2 = b.left + b.width / 2 - gcx, dy2 = b.top + b.height * .45 - gcy;
    type('[done]  record destroyed. dropping in bin', 't-red', 12);
    await go(ghost, [
      { transform: `translate(${dx1}px,${dy1}px) scale(.12) rotate(-20deg)` },
      { transform: `translate(${(dx1 + dx2) / 2}px,${Math.min(dy1, dy2) - 150}px) scale(.1) rotate(160deg)` },
      { transform: `translate(${dx2}px,${dy2}px) scale(.05) rotate(340deg)`, opacity: .7 }
    ], 750, 'cubic-bezier(.4,0,.6,1)');
    ghost.remove();
    bin.classList.remove('open'); await sleep(180);
    bin.classList.add('shake'); await sleep(420);

    // 8. the thief vanishes; the guardian limps home
    const tr = thief.getBoundingClientRect();
    puff(tr.left + tr.width / 2, tr.top + tr.height * .55, layer, 12, 'purple');
    fade(thief, 1, 0);
    await sleep(550);
    dizzy.remove();
    const gr = guard.getBoundingClientRect();
    puff(gr.left + gr.width / 2, gr.top + gr.height / 2, layer, 10);
    fade(guard, 1, 0);
    await sleep(700);
    ov.classList.add('out'); bin.classList.add('out');
    await sleep(300);
  } catch {}
  finally {
    ov.remove(); ghost.remove(); layer.remove(); bin?.remove();
    vn?.classList.remove('away'); shredBusy = false;
  }
}

/* ---------- Ask dialog ---------- */
function ask({ title, message = '', fields = [], ok = 'OK', danger = false, validate }) {
  return new Promise(resolve => {
    const d = $('#ask'), form = $('#askForm'), okBtn = $('#askOk'), box = $('#askFields');
    $('#askTitle').textContent = title; $('#askMsg').textContent = message; $('#askErr').textContent = '';
    $('#askMsg').classList.toggle('hidden', !message);
    box.replaceChildren();
    const inputs = fields.map(fd => {
      const l = el('label', 'field'), i = el('input', 'input');
      i.type = fd.type || 'text'; i.autocomplete = fd.autocomplete || 'off';
      l.append(el('span', null, fd.label), i); box.append(l); return i;
    });
    okBtn.textContent = ok; okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-brass');
    let done = false;
    const finish = v => { if (done) return; done = true; form.onsubmit = null; $('#askCancel').onclick = null; d.onclose = null; if (d.open) d.close(); resolve(v); };
    form.onsubmit = async e => {
      e.preventDefault();
      const vals = inputs.map(i => i.value);
      if (validate) {
        okBtn.disabled = true; const err = await validate(vals); okBtn.disabled = false;
        if (err) { $('#askErr').textContent = err; return; }
      }
      finish(fields.length ? vals : true);
    };
    $('#askCancel').onclick = () => finish(null);
    d.onclose = () => finish(null);
    d.showModal(); (inputs[0] || okBtn).focus();
  });
}

/* ---------- Export / import / change password ---------- */
async function exportBackup() {
  const blob = await sealBlob(key, salt, entries);
  const url = URL.createObjectURL(new Blob([blob], { type: 'application/json' }));
  const a = el('a'); a.href = url; a.download = `vault-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  try { localStorage.setItem(BK_KEY, String(Date.now())); } catch {}
  toast('Backup exported. It stays encrypted with your master password.');
}
$('#exportBtn').addEventListener('click', exportBackup);
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  const text = await file.text();
  try { if (JSON.parse(text).app !== 'brass-vault') throw 0; }
  catch { toast('That file isn\u2019t a Vault backup.', true); return; }
  let result = null;
  const vals = await ask({
    title: 'Import backup', message: `Enter the master password that was used when \u201C${file.name}\u201D was exported.`,
    fields: [{ label: 'Backup password', type: 'password' }], ok: 'Import',
    validate: async ([pw]) => { try { result = await openBlob(pw, text); return null; } catch { return 'That password doesn\u2019t open this backup.'; } }
  });
  if (!vals || !result) return;
  let added = 0, updated = 0;
  for (const item of result.list || []) {
    const existing = entries.find(x => x.id && x.id === item.id);
    if (!existing) { entries.push(item); added++; }
    else if ((item.updated || 0) > (existing.updated || 0)) { Object.assign(existing, item); updated++; }
  }
  await persist(); render();
  toast(`Imported ${added} new ${added === 1 ? 'login' : 'logins'}${updated ? `, updated ${updated}` : ''}.`);
});
$('#changePwBtn').addEventListener('click', async () => {
  const vals = await ask({
    title: 'Change master password', ok: 'Change password',
    fields: [{ label: 'Current master password', type: 'password' }, { label: 'New master password', type: 'password', autocomplete: 'new-password' }, { label: 'Confirm new password', type: 'password', autocomplete: 'new-password' }],
    validate: async ([cur, nw, cf]) => {
      try { await openBlob(cur, storageGet()); } catch { return 'Current password is wrong.'; }
      if (nw.length < 8) return 'Use at least 8 characters for the new password.';
      if (nw !== cf) return 'The new passwords don\u2019t match.';
      return null;
    }
  });
  if (!vals) return;
  salt = crypto.getRandomValues(new Uint8Array(16));
  key = await deriveKey(vals[1], salt);
  await persist();
  toast('Master password changed. Export a fresh backup so it matches.');
});

  const wrap = el('div', 'msg-wrap');
  const scroll = el('button', 'msg-scroll'); scroll.type = 'button';
  const paper = el('span', 'msg-paper');
  const days = last ? Math.floor((Date.now() - last) / 864e5) : 0;
  paper.append(el('strong', null, 'Time to back up your vault'),
    el('span', null, last ? `Your last backup was ${days} days ago. Tap to export an encrypted copy.` : 'You haven\u2019t made a backup yet. Tap to export an encrypted copy.'));
  scroll.append(el('span', 'roller'), paper, el('span', 'roller'));
  const close = el('button', 'msg-close', '\u00D7'); close.type = 'button'; close.setAttribute('aria-label', 'Dismiss backup reminder');
  wrap.append(scroll, close); layer.append(wrap);

  let done = false;
  const auto = setTimeout(() => leave(false), 25000);
  async function leave(exported) {
    if (done) return; done = true; clearTimeout(auto);
    scroll.classList.add('rolled'); close.remove();
    await wait(300); wrap.remove();
    if (exported) {
      n.classList.remove('present'); n.classList.add('bow'); await wait(950);
      const r = n.getBoundingClientRect(); puff(r.left + r.width / 2, r.top + r.height * .55, layer, 10);
      n.style.opacity = '0'; await wait(800);
    } else {
      n.classList.remove('present', 'face-left'); n.classList.add('run');
      await anim(n, [{ transform: T(stopX, y) }, { transform: T(innerWidth + 30, y) }], 500, 'linear');
    }
    layer.remove();
  }
  scroll.addEventListener('click', async () => { if (done) return; await exportBackup(); leave(true); });
  close.addEventListener('click', () => leave(false));
}

// --- Ninja fly: a kite glider drifts across the sky ---
function kiteFlight() {
  if (!reduceMotion && !document.hidden) {
    const f = el('div', 'kite-flyer'); f.innerHTML = KITE_SVG;
    const n = makeNinja(); n.classList.add('hang');
    Object.assign(n.style, { width: '40px', height: '50px', left: '12px', top: '52px' });
    f.append(n);
    const rtl = Math.random() < .5;
    if (rtl) { f.classList.add('rtl'); n.classList.add('face-left'); }
    $('#valleyFx').append(f);
    const y0 = innerHeight * (.08 + Math.random() * .16);
    const x0 = rtl ? innerWidth + 80 : -160, x1 = rtl ? -160 : innerWidth + 80;
    const frames = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      frames.push({ transform: `translate(${x0 + (x1 - x0) * t}px,${y0 + Math.sin(t * Math.PI * 3) * 26 - t * 30}px) rotate(${Math.sin(t * Math.PI * 3) * 4}deg)` });
    }
    f.animate(frames, { duration: 20000, easing: 'linear', fill: 'forwards' }).finished.then(() => f.remove()).catch(() => f.remove());
  }
  setTimeout(kiteFlight, 35000 + Math.random() * 30000);
}

// --- Revenge: the thief sneaks through the valley and gets a flying kick ---
async function revengeLoop() {
  await revengeScene();
  if (key) later(revengeLoop, 100000 + Math.random() * 60000);
}
async function revengeScene() {
  if (!key || reduceMotion || document.hidden || ninjaBusy || shredBusy || document.querySelector('dialog[open]')) return;
  const wasTraining = $('#valley').classList.contains('training');
  stopTraining(); clearTimeout(trainTimer);
  const vn = $('#valleyNinja'); const vr = vn.getBoundingClientRect();
  if (!vr.width) return;
  ninjaBusy = true;
  const scene = el('div'); $('#valleyFx').append(scene);
  try {
    const W = 72, H = 90, gy = innerHeight - H - 26;
    const thief = makeNinja(); thief.classList.add('thief', 'face-left', 'sneak'); scene.append(thief);
    const tx = Math.max(innerWidth * .32, 110);
    await anim(thief, [{ transform: T(innerWidth + 20, gy) }, { transform: T(tx, gy) }], 3400, 'linear');
    if (!key) return;
    thief.classList.remove('sneak'); restartCls(thief, 'nope');
    await wait(550);

    vn.classList.add('away');
    const g = makeNinja(); g.classList.add('flykick', 'face-left'); scene.append(g);
    const s0 = vr.width / W;
    const gx0 = vr.left - (W - vr.width) / 2, gy0 = vr.top - (H - vr.height) / 2;
    const hitX = tx + W * .62;
    await anim(g, [
      { transform: T(gx0, gy0, 0, s0, s0) },
      { transform: T((gx0 + hitX) / 2, Math.min(gy0, gy) - 90, -20, .85, .85) },
      { transform: T(hitX, gy - 12, -10) }
    ], 620, 'cubic-bezier(.4,0,.6,1)');
    spark(tx + W * .6, gy + H * .5, scene);
    thief.classList.add('jump');
    anim(thief, [
      { transform: T(tx, gy, 0), opacity: 1 },
      { transform: T(tx - 170, gy - 150, -540), opacity: 1, offset: .6 },
      { transform: T(tx - 330, gy - 70, -900), opacity: 0 }
    ], 900, 'cubic-bezier(.2,.6,.4,1)');
    setTimeout(() => puff(tx - 200, gy - 110, scene, 10, 'purple'), 500);
    g.classList.remove('flykick');
    await anim(g, [{ transform: T(hitX, gy - 12, -10) }, { transform: T(hitX, gy, 0) }], 180, 'ease-in');
    g.classList.add('cheer');
    await anim(g, [{ transform: T(hitX, gy) }, { transform: T(hitX, gy - 18) }, { transform: T(hitX, gy) }], 420);
    await wait(500);
    g.classList.remove('cheer', 'face-left'); g.classList.add('jump');
    await anim(g, [
      { transform: T(hitX, gy, 0) },
      { transform: T((gx0 + hitX) / 2, Math.min(gy0, gy) - 100, 180, .85, .85) },
      { transform: T(gx0, gy0, 360, s0, s0) }
    ], 650, 'cubic-bezier(.4,0,.6,1)');
  } catch {}
  finally {
    scene.remove(); vn.classList.remove('away'); ninjaBusy = false;
    if (key) { if (wasTraining) startTraining(); else armTraining(); }
  }
}

/* ---------- Theme toggle ---------- */
function paintThemeButtons() {
  const dark = document.documentElement.dataset.theme !== 'light';
  document.querySelectorAll('.theme-toggle').forEach(b => {
    b.innerHTML = dark ? I.sun : I.moon;
    const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
    b.setAttribute('aria-label', label); b.title = label;
    b.setAttribute('aria-pressed', String(dark));
  });
}
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  if (!reduceMotion) { root.classList.add('theme-anim'); setTimeout(() => root.classList.remove('theme-anim'), 350); }
  root.dataset.theme = next;
  try { localStorage.setItem('brass-vault.theme', next); } catch {}
  paintThemeButtons();
}));
paintThemeButtons();

/* ---------- Start ---------- */
buildValley();
setLockMode();
startLockout();
updateRain();
setTimeout(kiteFlight, 5000);
$('#lockPw').focus();
})();
</script>
